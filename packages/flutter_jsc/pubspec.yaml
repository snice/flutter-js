name: flutter_jsc
description: >-
  JS/TS runtime for Flutter. Embeds QuickJS-ng in native code with direct
  JSI-style JS<->C++ calls, supports source and QuickJS bytecode bundles,
  and renders HTML-like JS tags as Flutter widgets.
version: 0.1.0
repository: https://example.com/flutter-js

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        pluginClass: FlutterJscPlugin
        package: dev.flutterjs.flutter_jsc
      ios:
        pluginClass: FlutterJscPlugin
      macos:
        pluginClass: FlutterJscPlugin
